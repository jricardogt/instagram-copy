<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/style.css">
    <title>Perfil | Ricardo</title>
</head>

<body>
    <nav id="navigation">
        <img src="assets/Instagram_logo.svg.webp" alt="logo Instagram">

        <div>
            <a id="login" href="">Entrar</a>
            <a id="cadastro" href="">Cadastre-se</a>
        </div>
    </nav>

    <main>
        <div id="container">
            <section id="profile">

                <div id="container-pills">
                    <div class="pill">
                        <span><i class="fi fi-rr-console-controller"></i></span>
                        <P>Games</P>
                    </div>
                    <div class="pill">
                        <span><i class="fi fi-rr-book-alt"></i></span>
                        <P>Books</P>
                    </div>
                    <div class="pill">
                        <span><i class="fi fi-rr-popcorn"></i></span>
                        <P>Cinema</P>
                    </div>
                </div>
                <div id="profile-imgs">
                    <div id="profile-icon">
                        <img src="assets/images.jpg" alt="Imagem de Perfil">
                    </div>

                    <div id="profile-banner">
                        <img src="assets/banner.jpg" alt="Imagem de Banner">
                    </div>
                </div>

                <div id="profile-content">
                    <div id="profile-details">
                        <div id="profile-details--names">
                            <h1>Ricaaaaaardo</h1>
                            <p>@rick_1</p>
                        </div>

                        <div id="profile-details--follows">
                            <p><span>20</span> posts</p>
                            <p><span>1000</span> seguidores</p>
                            <p><span>1230</span> seguindo</p>
                        </div>

                        <div id="profile-details--desc">
                            <p>
                                Gosto de Avatar: A Lenda de Aang, chocolate, hambúrguer e pizza 🤭​
                            </p>
                        </div>
                    </div>

                    <div id="profile-details--buttons">
                        <a><i class="fi fi-rr-following"></i></a>
                        <a href=""><i class="fi fi-rr-messages"></i></a>
                        <a><i class="fi fi-rr-paper-plane"></i></a>
                        <a><i class="fi fi-rr-menu-dots"></i></a>
                    </div>
                </div>
            </section>

            <section id="highlights">
                <article class="highlight">
                    <div>
                        <img src="assets/posts/alena-tretiakova-ET3Fr97nXBo-unsplash.jpg" alt="Imagem Destaque">
                    </div>
                    <p>Destaque</p>
                </article>

                <article class="highlight">
                    <div>
                        <img src="assets/anime-girl-blue-hair-nature-pond-butterfly-4k-wallpaper-uhdpaper.com-729@2@b.jpg"
                            alt="Imagem Destaque">
                    </div>
                    <p>Anime</p>
                </article>

                <article class="highlight">
                    <div>
                        <img src="assets/posts/images (1).jpg" alt="Imagem Destaque">
                    </div>
                    <p>Mangá</p>
                </article>

                <article class="highlight">
                    <div>
                        <img src="assets/posts/nicolas-hans-xGVjRRmnHlQ-unsplash.jpg" alt="Imagem Destaque">
                    </div>
                    <p>Paisagem</p>
                </article>

                <article class="highlight">
                    <div>
                        <img src="assets/posts/manja-vitolic-gKXKBY-C-Dk-unsplash.jpg" alt="Imagem Destaque">
                    </div>
                    <p>GATOOOOOOSSS</p>
                </article>
            </section>
        </div>

        <section id="posts">
            <div class="post">
                <img src="assets/posts/anime-girl-with-cat-silhoutte-4k-wallpaper-uhdpaper.com-757@5@r.jpg"
                    alt="Imagem de Feed">
            </div>
            <div class="post">
                <img src="assets/posts/bruno-bd-v1uN0dlA9HA-unsplash.jpg" alt="Imagem de Feed">
            </div>
            <div class="post">
                <img src="assets/posts/erke-rysdauletov-hQaPeK_8ns4-unsplash.jpg" alt="Imagem de Feed">
            </div>
            <div class="post">
                <img src="assets/posts/jamo-images-f2CPkHubfLc-unsplash.jpg" alt="Imagem de Feed">

            <div class="post">

            </div>
            <div class="post">
                <img src="assets/posts/vincent-yap-Fe9wvQaIzAg-unsplash.jpg" alt="Imagem de Feed">
            </div>
            <div class="post">
                <img src="assets/posts/alena-tretiakova-6Ox-Vat8ExA-unsplash.jpg" alt="Imagem de Feed">
            </div>
            <div class="post">
                <img src="assets/posts/alena-tretiakova-ET3Fr97nXBo-unsplash.jpg" alt="Imagem de Feed">
            </div>
            <div class="post">
                <img src="assets/posts/daniel-akselrod-_fmKYpc1fEI-unsplash.jpg" alt="Imagem de Feed">
            </div>
        </section>

</html>
